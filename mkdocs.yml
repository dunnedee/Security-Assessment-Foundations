site_name: Security Assessment Foundations
site_description: >-
  An open, syllabus-aligned learning resource for people getting into
  penetration testing and security assessment. Mapped to the CREST CPSA
  syllabus, written as defensive reference material, not exam recall.
site_author: Mick Dunne
site_url: https://dunnedee.github.io/Security-Assessment-Foundations/
repo_url: https://github.com/dunnedee/Security-Assessment-Foundations
repo_name: Security-Assessment-Foundations
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/shield-lock-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables

plugins:
  - search

extra:
  generator: false

copyright: >-
  Licensed under
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>.
  CPSA and CREST are trademarks of their respective owners; this is an
  independent study resource and is not affiliated with or endorsed by CREST.

